<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuegu | Photographer Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- === SWIPER CSS START === -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <!-- === SWIPER CSS END === -->

    <style>
        :root {
            --primary: #ED7A05;
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --apple-radius: 28px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            color: var(--text-main);
            overflow-x: hidden;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 40px;
            background: var(--bg-card);
            border-radius: var(--apple-radius);
            border: 1px solid var(--border);
            text-align: center;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 60px;
        }

        .profile-container {
            position: relative;
        }

        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid var(--primary);
            object-fit: cover;
        }

        .badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: var(--primary);
            color: white;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .hero-text h1 {
            margin: 10px 0;
            font-size: 2.5rem;
        }

        .section-title {
            font-size: 1.5rem;
            margin: 40px 0 20px;
            color: var(--primary);
        }

        /* === SWIPER STYLE START === */
        .gallery-container {
            margin: 40px -40px;
            padding: 20px 0;
            overflow: hidden;
            min-height: 560px;
            position: relative;
        }

        .swiper {
            width: 100%;
            padding: 0 40px 60px 40px !important;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .swiper.initialized {
            opacity: 1;
        }

        .swiper-slide {
            height: 500px;
            border-radius: var(--apple-radius);
            overflow: hidden;
            background: #222;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            transform: scale(0.92);
            opacity: 0.5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 桌面版寬度 */
        .size-normal {
            width: 340px;
        }

        .size-wide {
            width: 600px;
        }

        .size-narrow {
            width: 280px;
        }

        .swiper-slide-active {
            transform: scale(1);
            opacity: 1;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 確保圖片填滿但不變形 */
            display: block;
        }

        .swiper-pagination-bullet-active {
            background: var(--primary) !important;
        }

        /* === SWIPER STYLE END === */

        .cta-box {
            margin-top: 60px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--apple-radius);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .social-links img {
            width: 32px;
            height: 32px;
            filter: brightness(0) invert(1);
            transition: transform 0.3s;
        }

        .social-links a:hover img {
            transform: translateY(-5px);
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* 手機版適配修正 */
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 20px 15px;
                border-radius: 20px;
            }

            .gallery-container {
                margin: 20px -20px;
                min-height: auto;
            }

            .swiper {
                padding: 0 20px 40px 20px !important;
                /* 減少側邊邊距，讓內容更大 */
            }

            .swiper-slide {
                height: 450px;
                /* 增加手機版高度感，防止壓扁 */
                width: 85vw !important;
                /* 強制所有圖片在手機版佔據大部分寬度 */
                border-radius: 20px;
            }

            .hero-text h1 {
                font-size: 1.8rem;
            }

            .section-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo"><span class="logo-icon">P</span> Profile</div>
        <select class="lang-select" onchange="changeLanguage(this.value)">
            <option value="zh">繁體中文</option>
            <option value="en">English</option>
        </select>
    </nav>

    <div class="container" id="main-content">
        <header class="hero">
            <div class="profile-container">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Yuegu" alt="Yuegu" class="profile-img">
                <span class="badge" id="i18n-badge">PRO</span>
            </div>
            <div class="hero-text">
                <h1 id="i18n-name">Yuegu</h1>
                <div class="title" id="i18n-title">攝影師 / 開發者</div>
                <p class="bio" id="i18n-bio">捕捉瞬間，轉化為永恆的視覺故事。</p>
            </div>
        </header>

        <h2 class="section-title" id="i18n-galleryTitle">精選作品庫集</h2>

        <div class="gallery-container">
            <div class="swiper mySwiper">
                <div id="swiper-wrapper-common" class="swiper-wrapper"></div>
                <!-- 分頁點 -->
                <div class="swiper-pagination"></div>
            </div>
        </div>

        <div class="cta-box">
            <h2 id="i18n-ctaTitle">保持聯絡</h2>
            <p id="i18n-ctaDesc">歡迎透過以下平台關注我的最新創作。</p>
            <div class="social-links">
                <a href="https://www.facebook.com/Singyuegu/" target="_blank"><img
                        src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="facebook"></a>
                <a href="https://www.instagram.com/singyuegu/" target="_blank"><img
                        src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="instagram"></a>
                <a href="https://www.flickr.com/photos/singyuegu/" target="_blank"><img
                        src="https://cdn-icons-png.flaticon.com/512/889/889147.png" alt="flickr"></a>
                <a href="https://github.com/Singyuegu" target="_blank"><img
                        src="https://cdn-icons-png.flaticon.com/512/733/733553.png" alt="github"></a>
            </div>
        </div>

        <footer>
            <p>© 2026 Yuegu Portfolio</p>
        </footer>
    </div>

    <!-- === SWIPER JS LIBRARY === -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        const photoUrls = [
            "https://live.staticflickr.com/65535/53868795358_78248d6bb1_k.jpg",
            "https://live.staticflickr.com/65535/54002353423_f0b1557ec6_k.jpg",
            "https://live.staticflickr.com/65535/54355713540_4bbfad8c6f_k.jpg",
            "https://live.staticflickr.com/65535/54180628776_ecd1df4b4f_h.jpg",
            "https://live.staticflickr.com/65535/54355512999_5124e4f8ce_h.jpg",
            "https://live.staticflickr.com/65535/53839127991_20440c8c98_h.jpg",
            "https://live.staticflickr.com/65535/54101822534_ae4bfa55d2_h.jpg",
            "https://live.staticflickr.com/65535/53977667019_39bc464806_h.jpg",
            "https://live.staticflickr.com/65535/53839126886_c0e1a45848_h.jpg",
            "https://live.staticflickr.com/65535/53917344867_e74ed51862_h.jpg"
        ];

        const translations = {
            zh: {
                title: "攝影師 / 開發者",
                bio: "捕捉瞬間，轉化為永恆的視覺故事。",
                gallery: "精選作品庫集",
                ctaTitle: "保持聯絡",
                ctaDesc: "歡迎透過以下平台關注我的最新創作。"
            },
            en: {
                title: "Photographer / Developer",
                bio: "Capturing moments, transforming them into eternal visual stories.",
                gallery: "Featured Portfolio",
                ctaTitle: "Get in Touch",
                ctaDesc: "Follow my latest creations on these platforms."
            }
        };

        async function renderAutoGallery() {
            const wrapper = document.getElementById('swiper-wrapper-common');

            const cardsData = await Promise.all(photoUrls.map(url => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.src = url;
                    img.onload = () => {
                        const ratio = img.width / img.height;
                        let sizeClass = "size-normal";
                        if (ratio > 1.2) sizeClass = "size-wide";
                        if (ratio < 0.8) sizeClass = "size-narrow";
                        resolve({ url, sizeClass });
                    };
                    img.onerror = () => resolve({ url, sizeClass: "size-normal" });
                });
            }));

            wrapper.innerHTML = cardsData.map(photo => `
                <div class="swiper-slide ${photo.sizeClass}">
                    <img src="${photo.url}" loading="lazy" alt="Photography">
                </div>
            `).join('');

            initSwipers();
        }

        function initSwipers() {
            new Swiper(".mySwiper", {
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: "auto",
                spaceBetween: 20,
                pagination: { el: ".swiper-pagination", clickable: true },
                on: {
                    init: function () {
                        this.el.classList.add('initialized');
                    },
                },
            });
        }

        function changeLanguage(lang) {
            const t = translations[lang];
            if (!t) return;
            document.getElementById('i18n-title').innerText = t.title;
            document.getElementById('i18n-bio').innerText = t.bio;
            document.getElementById('i18n-galleryTitle').innerText = t.gallery;
            document.getElementById('i18n-ctaTitle').innerText = t.ctaTitle;
            document.getElementById('i18n-ctaDesc').innerText = t.ctaDesc;
        }

        renderAutoGallery();
    </script>
</body>

</html>
